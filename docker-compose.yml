
services:
  app:
    build: .
    container_name: task-manager-app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: taskuser
      DB_PASSWORD: ${DB_PASSWORD:-localdev123}
      DB_NAME: taskmanager
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    container_name: task-manager-db-compose
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev123}
      POSTGRES_DB: taskmanager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskmanager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
